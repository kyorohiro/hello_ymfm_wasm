name: Verify SDK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: windows-x86_64
            runner: windows-latest
          - platform: macos-arm64
            runner: macos-14
          - platform: macos-x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Check source inventories
        run: python scripts/check_sdk.py
      - name: Test release audit tools
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Build and test the extracted source release
        shell: python
        run: |
          import json, os, pathlib, subprocess, sys
          version = json.loads(pathlib.Path('sdk.json').read_text())['version']
          subprocess.run([sys.executable, 'scripts/package_release.py', '--out-dir', 'releases'], check=True)
          environment = os.environ.copy()
          if sys.platform.startswith('linux'):
              environment.update(CC='gcc', CXX='g++')
          subprocess.run([
              sys.executable, 'tests/check_standalone_release.py',
              '--source-zip', f'releases/tetorica-soundchip-native-{version}-sources.zip',
              '--work-dir', str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'SDK source isolation'),
          ], env=environment, check=True)
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-validation-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            releases/SHA256SUMS
            ${{ runner.temp }}/SDK source isolation/native-build/CMakeCache.txt
            ${{ runner.temp }}/SDK source isolation/native-build/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/SDK source isolation/native-build/compile_commands.json
            ${{ runner.temp }}/SDK source isolation/native-build/Testing/Temporary/*.log

  wasm:
    name: WASM / YM2612
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: emscripten-core/setup-emsdk@667eb33f24e84e7f362c16d8d7fff0629a73e15e # v15
        with:
          version: '6.0.6'
      - name: Compile YM2612 WASM and record its inputs
        run: sh scripts/build-wasm.sh ym2612 build/ci-wasm
      - name: Package and verify the WASM release and matching sources
        shell: python
        run: |
          import json, os, pathlib, subprocess, sys
          version = json.loads(pathlib.Path('sdk.json').read_text())['version']
          subprocess.run([
              sys.executable, 'scripts/package_release.py', '--out-dir', 'releases',
              '--wasm-dir', 'build/ci-wasm',
          ], check=True)
          subprocess.run([
              sys.executable, 'tests/check_standalone_release.py',
              '--source-zip', f'releases/tetorica-soundchip-native-{version}-sources.zip',
              '--wasm-zip', f'releases/tetorica-soundchip-native-{version}-wasm.zip',
              '--work-dir', str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'SDK WASM isolation'),
              '--audit-only', '--javascript-smoke', '--wasm-smoke', '--build-wasm', 'ym2612',
          ], check=True)
      - name: Retain verified archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-sdk-archives
          retention-days: 14
          if-no-files-found: error
          path: |
            releases/*.zip
            releases/SHA256SUMS
            build/ci-wasm/build-info.json
