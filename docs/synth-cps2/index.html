<style>
*{box-sizing:border-box}html{background:#122c47;color:#102f45;font:1rem/1.5 "Atkinson Hyperlegible Next",system-ui,sans-serif}
body{margin:4vh auto;padding:1.25rem;width:min(100%,52rem)}main{background:#f4eedb;border-radius:18px;overflow:hidden}

h2{font-size:1.15rem;margin:0 0 .6rem}button,select{font:inherit;color:inherit;border:1px solid #7a9897;background:#fffaf0;border-radius:5px;padding:.4rem .7rem;cursor:pointer}button[aria-pressed=true]{background:#155876;color:white}

footer{padding:1rem 1.5rem;background:#d9e6df}output{display:block}button:focus-visible{outline:3px solid #ed9334}@media(max-width:540px){#channels{grid-template-columns:repeat(4,1fr)}body{margin:0;padding:.5rem}}
#pcm-wave{display:block;width:100%;height:6.5rem;background:#102c43;border-radius:5px}
#pcm-controls,.echo-controls{display:flex;gap:.45rem;flex-wrap:wrap;margin:.6rem 0}
.param-control{display:grid;grid-template-columns:auto minmax(3rem,1fr) auto;border:1px solid #7a9897;border-radius:5px}
.param-label{grid-column:1/-1;text-align:center;font-size:.82rem}

.mix-voices>div{display:flex;align-items:center;gap:.2rem}.mix-voices strong{flex:1}
.mix-voices button{font-size:.85rem;padding:.2rem .35rem}
.output-heading{display:flex;align-items:center;flex-wrap:wrap;gap:.6rem;margin-bottom:.4rem}
.output-heading h2{margin:0}.output-heading button{padding:.2rem .55rem}
#output-scope{display:block;width:100%;height:7rem;border-radius:5px;background:#102c43}
#song-position{display:block;font-variant-numeric:tabular-nums}
.seek-track{position:relative;margin:.35rem 0}

#loop-mark{position:absolute;bottom:0;height:.45rem;width:2px;background:#155876;pointer-events:none}

<main><header><img src="../tetorica_cps2_synth.webp" alt="" width="72" height="72"><div><h1>Tetorica CPS2 Synth</h1><p>QSound DL-1425 · PCM / ADPCM preview</p></div></header>

<span id="code-status" role="status"></span>
<div id="code-host"></div><textarea id="source" aria-label="JavaScript source" spellcheck="false">// Select CH2 to play over the CH1 bass. Trigger ADPCM with 1, 2, 3.
// Edit the notes or echo send and press Apply.
setBpm(112);
qsound.writeRegister(0xba, 8192);  // CH1 echo send
qsound.writeRegister(0xd9, 0x554 + 720);
qsound.writeRegister(0x93, 10000);
liveLoop('bass', async () => {
  for (const note of [36, 43, 39, 46]) {
    qsound.noteOn(1, note);
    await beat(0.38);
    qsound.noteOff(1);
    await beat(0.12);
  }
});</textarea><p id="editor-note" hidden></p></div></div></section>
