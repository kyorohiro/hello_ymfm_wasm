<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/webp" href="../tetorica_cps2_synth.webp">
<title>Tetorica CPS2 Synth · QSound PCM</title>
<style>
*{box-sizing:border-box}html{background:#122c47;color:#102f45;font:1rem/1.5 "Atkinson Hyperlegible Next",system-ui,sans-serif}
body{margin:4vh auto;padding:1.25rem;width:min(100%,52rem)}main{background:#f4eedb;border-radius:18px;overflow:hidden}
header{display:flex;align-items:center;gap:1rem;background:#176481;color:white;padding:1.2rem 1.5rem}h1,p{margin:0}h1{font-size:clamp(1.5rem,5vw,2.4rem)}section{padding:1.1rem 1.5rem}
h2{font-size:1.15rem;margin:0 0 .6rem}button,select{font:inherit;color:inherit;border:1px solid #7a9897;background:#fffaf0;border-radius:5px;padding:.4rem .7rem;cursor:pointer}button[aria-pressed=true]{background:#155876;color:white}
#channels{display:grid;grid-template-columns:repeat(8,1fr);gap:.3rem}label{display:inline-grid;gap:.25rem;margin:.25rem .7rem .25rem 0}#keys{display:flex;flex-wrap:wrap;gap:.3rem}#keys button{touch-action:none;min-height:3rem}
footer{padding:1rem 1.5rem;background:#d9e6df}output{display:block}button:focus-visible{outline:3px solid #ed9334}@media(max-width:540px){#channels{grid-template-columns:repeat(4,1fr)}body{margin:0;padding:.5rem}}
#pcm-wave{display:block;width:100%;height:6.5rem;background:#102c43;border-radius:5px}
#pcm-controls,.echo-controls{display:flex;gap:.45rem;flex-wrap:wrap;margin:.6rem 0}
.param-control{display:grid;grid-template-columns:auto minmax(3rem,1fr) auto;border:1px solid #7a9897;border-radius:5px}
.param-label{grid-column:1/-1;text-align:center;font-size:.82rem}
.param-control button{border:0;padding:.15rem .45rem;background:transparent}
.param-value{cursor:ew-resize;touch-action:none;user-select:none;font-variant-numeric:tabular-nums}
#pcm-caption{font-size:.85rem;font-variant-numeric:tabular-nums}
#adpcm-pads{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(12rem,100%),1fr));gap:.6rem}
.adpcm-voice{display:grid;gap:.3rem;min-width:0;margin:0;border:1px solid #7a9897;border-radius:6px}
.adpcm-pad{background:#172f45;color:white;touch-action:manipulation}
.adpcm-pad:active{background:#176481}
#keys[hidden]{display:none}
#code-host{height:clamp(18rem,45vh,40rem)}
#code-host:not([data-ready="true"]){display:none}
#source{width:100%;min-height:18rem;font:1rem/1.5 monospace}
#code-panel button{margin:.4rem .2rem .4rem 0}
</style>
<main><header><img src="../tetorica_cps2_synth.webp" alt="" width="72" height="72"><div><h1>Tetorica CPS2 Synth</h1><p>QSound DL-1425 · PCM / ADPCM preview</p></div></header>
<section><h2>PCM channel</h2><div id="channels"></div>
<label>Sample<select id="wave"><option>Reed</option><option>Bell</option></select></label>
<label>Pan <input id="pan" type="range" min="0" max="32" value="16"></label>
<label>Volume <input id="vol" type="range" min="0" max="16384" value="8000"></label>
<div id="pcm-controls"></div>
<canvas id="pcm-wave" width="768" height="112" aria-label="PCM sample waveform with loop region and playback cursor"></canvas>
<p id="pcm-caption"></p>
<div class="echo-controls" id="echo-controls" role="group" aria-label="PCM echo"></div></section>
<section><nav aria-label="Performance"><button id="keyboard-tab" aria-controls="keys" aria-pressed="true">Keyboard</button>
<button id="code-tab" aria-controls="code-panel" aria-pressed="false">Code</button></nav>
<div id="keys"></div>
<div id="code-panel" hidden>
<button id="run-code">Run</button><button id="apply-code" disabled>Apply</button><button id="stop-code" disabled>Stop</button>
<span id="code-status" role="status"></span>
<div id="code-host"></div><textarea id="source" aria-label="JavaScript source" spellcheck="false">// Select CH2 to play over the CH1 bass. Trigger ADPCM with 1, 2, 3.
// Edit the notes or echo send and press Apply.
setBpm(112);
qsound.writeRegister(0xba, 8192);  // CH1 echo send
qsound.writeRegister(0xd9, 0x554 + 720);
qsound.writeRegister(0x93, 10000);
liveLoop('bass', async () => {
  for (const note of [36, 43, 39, 46]) {
    qsound.noteOn(1, note);
    await beat(0.38);
    qsound.noteOff(1);
    await beat(0.12);
  }
});</textarea><p id="editor-note" hidden></p></div></section>
<section aria-labelledby="adpcm-heading"><h2 id="adpcm-heading">ADPCM pads</h2>
<p>Press 1, 2 or 3 to trigger a one-shot. Volume applies on the next trigger.</p>
<div id="adpcm-pads"></div></section>
<footer><label>Demo<select id="score"><option value="demo">PCM duet</option><option value="adpcm">ADPCM trio</option><option value="echo">PCM echo comparison</option></select></label> <button id="demo">Play demo</button> <button id="stop">Stop</button> <button id="save">Download demo VGM</button><output aria-live="polite"></output></footer></main><script type="module" src="./app.js"></script></html>
