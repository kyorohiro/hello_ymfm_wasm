<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tetorica CPS1 Synth</title>
<link rel="icon" href="../tetorica_cps1_synth.webp"><link rel="stylesheet" href="./synth.css">
<main data-mode="synth">
<header><details id="synthMenu">
<summary id="synthMenuButton" aria-label="Menu" title="Menu" aria-expanded="false" aria-controls="synthMenuPanel">☰</summary>
<div id="synthMenuPanel" class="synth-menu-panel">
<h2>New</h2><button id="newCassette" data-close-synth-menu>Cassette · ZIP</button>
<h2>Import</h2><button id="chooseOpm" data-close-synth-menu>OPM voice…</button><input id="importOpm" type="file" accept=".opm" hidden><button id="chooseVgm" data-close-synth-menu>VGM / VGZ…</button><button id="chooseCassette" data-close-synth-menu>Cassette…</button>
<h2>Export</h2><button id="exportCassette" data-close-synth-menu>Cassette · ZIP</button>
</div></details><input id="vgmFile" type="file" accept=".vgm,.vgz" hidden><input type="file" id="importCassette" aria-label="Import Cassette" accept=".zip" hidden><img src="../tetorica_cps1_synth.webp" alt="" width="80" height="80"><div><a href="../index.html">← Tetorica</a><h1>Tetorica CPS1 Synth</h1></div><div class="workspace-actions"><button id="filesToggle" disabled aria-expanded="false" aria-controls="files">Files</button><div class="mode-switch" role="group" aria-label="Workspace mode"><button id="synthMode" aria-pressed="true">Synth</button><button id="codeMode" aria-pressed="false">Code</button></div></div></header>
<section id="referenceSong" aria-label="VGM reference playback" hidden>
<div class="bar"><label>VGM <select id="songs" disabled></select></label><button id="playSong" disabled>Play</button><button id="pauseSong" disabled>Pause</button><button id="stopSong" disabled>Stop</button><output id="songTime"></output></div>
</section>
<section class="output"><div class="bar"><h2>Output</h2><div class="scope-modes" role="group" aria-label="Output display"><button data-visual-mode="waveform" aria-pressed="true">Waveform</button><button data-visual-mode="spectrum" aria-pressed="false">Spectrum</button></div><label>Master <input id="master" type="range" min="0" max="380" value="85"><output id="volume">85%</output></label><button id="power" title="Enable audio now, or play a note to start automatically">Start audio</button></div>
<canvas id="scope" width="900" height="96" aria-label="Output waveform"></canvas><output id="status" role="status">Ready</output></section>
<div id="workspace"><aside id="files" hidden><div class="files-heading"><h2>Files</h2><button id="saveVoice" data-tree-action="instrument" title="Create an instrument from the selected CH">＋ Instrument</button><button data-tree-action="code">＋ JS</button></div><p id="cassetteName">tetorica-cps1.cassette.zip</p>

<div class="file-tools"><label><input id="fileAuto" type="checkbox" checked>Auto apply</label><button id="fileSave">Save</button><button id="fileSaveAll">Save all</button><button id="fileDiscard">Discard</button></div>
<output id="filePath"></output><div id="fileTree" aria-label="Cassette files"></div><button id="copyChannelFile" hidden>Load voice on selected CH</button>
<div class="bar"><label id="opmPick" hidden>OPM voice <select id="opmVoice"></select></label><button id="opmGlobals" hidden>Apply shared LFO / CH8 noise</button></div>

<output id="fileStatus" role="status"></output></aside>
<dialog id="fileNameDialog" aria-labelledby="fileNameTitle"><form method="dialog">
<h3 id="fileNameTitle"></h3><label>Name <input id="fileName" required autocomplete="off"></label>
<div class="file-tools"><button type="submit" value="save">Save</button><button type="button" id="fileNameCancel">Cancel</button></div>
</form></dialog>
<div id="workbench">
<nav id="sourceTabs" aria-label="Sound chips"><button data-tab="fm">YM2151</button><button data-tab="pcm">MSM6295</button><button data-tab="mixer">Mixer</button></nav>
<section id="mixer" aria-label="Output mixer" hidden></section>
<template id="envelopeEditor">
<div role="group" aria-label="Edit operator envelope">
  <button data-envelope-operator="1">OP1</button>
  <button data-envelope-operator="2">OP2</button>
  <button data-envelope-operator="3">OP3</button>
  <button data-envelope-operator="4">OP4</button>
</div>
<div class="envelope-plot">
  <canvas data-operator-envelope width="540" height="150" role="img" aria-label="Relative YM2151 operator envelope guides"></canvas>
  <button data-envelope-handle="attack" aria-label="Attack"></button>
  <button data-envelope-handle="decay" aria-label="Decay"></button>
  <button data-envelope-handle="sustain" aria-label="Sustain"></button>
  <button data-envelope-handle="release" aria-label="Release"></button>
</div>
<output data-envelope-readout></output>
<p class="subtext">Drag a point sideways to change its rate. Drag the attack or decay point vertically to change TL or D1L. Curves show relative settings.</p>
</template>
<section id="fm"><div id="songVoice" hidden><label>Copy to <select id="songTarget"></select></label><button id="useSongVoice">Use voice</button></div></section>
<section id="pcm" hidden><div id="pcmEditor">
<div id="attenuation" class="chip-fields"></div><button id="followAttenuation" hidden>Use VGM attenuation</button>
<div class="bar"><label>ROM <select id="romList"></select></label><button id="importRom">Import ROM…</button><input id="rom" type="file" accept=".bin,.rom" hidden></div>
<fieldset class="rom-editor"><legend id="romName">0_default.rom</legend><p id="bankInfo"></p>
<div class="bar"><div id="slotControl" class="chip-fields"></div><button id="writeSlot">Load…</button><button id="deleteSlot">Del</button><input type="file" id="slotAudio" accept=".wav,.wave,.flac" hidden></div>
<div id="sampleSlots" role="group" aria-label="Sample slots"></div><output id="selectedSample"></output>
<figure class="sample-preview"><canvas id="sampleWave" width="768" height="96" aria-label="Decoded sample waveform"></canvas><figcaption id="sampleRange"></figcaption></figure><button id="previewSongSample" hidden>Preview</button>
<div class="bar"><button id="chooseSamples">Import WAV / FLAC…</button><input id="audioSamples" type="file" multiple accept=".wav,.wave,.flac" hidden><button id="restore">Restore default bank</button></div></fieldset>
<div id="voices" role="group" aria-label="MSM6295 voice assignments"></div><button id="followVoices" hidden>Use VGM samples</button>
<p><span id="voiceCount">0 / 4 voices playing</span> · Command bytes <output id="command">—</output> · Status <output id="busy">0xF0</output></p></div></section>

<nav id="performanceTabs" aria-label="Performance"><button data-tab="keyboardPanel">Keyboard</button><button data-tab="code">Code</button></nav>
<section id="keyboardPanel" aria-label="Guitar keyboard"><div class="keyboard-toolbar"><span id="pcmKeysHint" hidden>MSM6295 · Voice keys</span><div id="keyChannels" role="group" aria-label="Keyboard channel"></div><div id="keyOctave" role="group" aria-label="Keyboard octave">Octave</div></div><div id="keys"></div><button id="hitPad">Hit · Voice 4</button></section>
<section id="code" hidden><div class="bar"><h2>JavaScript</h2><select id="codeFile" aria-label="Code file"><option>/index.js</option><option>/examples/round-start.js</option><option>/examples/opm-algorithms.js</option></select></div><label class="sr" for="editor">Live code</label><textarea id="editor" rows="12" spellcheck="false"></textarea><div class="bar"><button id="run">Run</button><button id="stop">Stop</button></div></section>
</div></div></main><script type="module" src="./synth.js"></script></html>
