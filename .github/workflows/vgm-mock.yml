name: VGM parser and player tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  vgm-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned SDK and offline OPN build routes
        run: |
          python3 scripts/import_soundchip_sdk.py --check
          python3 -m unittest discover -s test -p 'test_*sdk*.py' -v
      - run: sh scripts/test_vgm_mock.sh
