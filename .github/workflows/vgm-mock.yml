name: VGM parser and player tests
# Run routine tests locally; use a tag push or an explicit manual CI run.
on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  vgm-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public tutorial source copies
        run: node scripts/sync_tutorial_sources.mjs --check
      - name: Verify pinned SDK and offline WASM build routes
        run: |
          python3 scripts/import_soundchip_sdk.py --check
          python3 -m unittest discover -s test -p 'test_*sdk*.py' -v
      - run: sh scripts/test_vgm_mock.sh
