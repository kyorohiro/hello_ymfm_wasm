name: SID Synth

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/synth-sid/**'
      - 'docs/tetorica_sid_synth.*'
      - 'docs/issues/tetorica_sid_icon_prompt_20261107.txt'
      - 'docs/index.html'
      - 'docs/index-ja.html'
      - 'docs/js/sid*'
      - 'docs/generated/sid/**'
      - 'docs/generated/sid8580-machine/**'
      - 'docs/sid8580-lab/psid_structure.js'
      - 'docs/sources/sid/**'
      - 'docs/synth/synth_keyboard.js'
      - 'docs/synth/synth_controls.js'
      - 'docs/synth-spu/synth.css'
      - 'docs/synth-spu/spu_synth_visualizer.js'
      - 'tetorica_src/runtime/sid*'
      - 'tetorica_src/runtime/generated/sid/**'
      - 'tetorica_src/wasm/sid*'
      - 'tetorica_src/wasm/sid8580-machine/**'
      - 'tetorica_src/wasm/sid8580-probe/**'
      - 'third_party/chips-m6581/**'
      - 'third_party/chips-c64/**'
      - 'third_party/chips-m6502/**'
      - 'third_party/sidera/**'
      - 'third_party/sid8580-machine-toolchain-notices/**'
      - 'test/runtime/sid*'
      - 'test/helpers/sid*'
      - 'LICENSE'
      - 'scripts/*sid*'
      - 'scripts/copy_readable_modules.mjs'
      - 'scripts/runtime_artifacts.mjs'
      - 'scripts/wasm_sdk_inventory.mjs'
      - 'package*.json'
      - '.github/workflows/sid-synth.yml'
  pull_request:
    paths:
      - 'docs/synth-sid/**'
      - 'docs/tetorica_sid_synth.*'
      - 'docs/issues/tetorica_sid_icon_prompt_20261107.txt'
      - 'docs/index.html'
      - 'docs/index-ja.html'
      - 'docs/js/**'
      - 'docs/generated/**'
      - 'docs/sid8580-lab/psid_structure.js'
      - 'docs/sources/sid/**'
      - 'docs/synth/**'
      - 'docs/synth-spu/synth.css'
      - 'docs/synth-spu/spu_synth_visualizer.js'
      - 'tetorica_src/runtime/**'
      - 'tetorica_src/wasm/sid*'
      - 'tetorica_src/wasm/sid8580-machine/**'
      - 'tetorica_src/wasm/sid8580-probe/**'
      - 'third_party/**'
      - 'test/runtime/sid*'
      - 'test/helpers/sid*'
      - 'LICENSE'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/sid-synth.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Test the source application
        run: |
          node scripts/sid_model_artifacts.mjs --check
          node --test test/runtime/sid8580.test.mjs test/runtime/sidsynth.test.mjs
          npm run test:sid-synth
          node scripts/check_sid_synth_browser.cjs --out release/sid-synth-source-browser.json --screenshots release/sid-synth-source-images
      - name: Package and play the standalone SID Synth
        run: |
          sh scripts/package_itch_sid_synth.sh ci
          python3 -m zipfile -e release/tetorica_sid_synth_ci_itch.zip release/sid-synth-browser
          node scripts/check_sid_synth_browser.cjs --root release/sid-synth-browser --entry /index.html --out release/sid-synth-zip-browser.json --screenshots release/sid-synth-zip-images
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sid-synth-check
          path: |
            release/tetorica_sid_synth_ci_itch.zip
            release/sid-synth-source-browser.json
            release/sid-synth-zip-browser.json
            release/sid-synth-source-images/
            release/sid-synth-zip-images/
          if-no-files-found: ignore
