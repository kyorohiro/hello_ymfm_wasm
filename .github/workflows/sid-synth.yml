name: SID Synth

# Detailed verification is manual; routine tests run locally.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Test the source application
        run: |
          node scripts/sid_model_artifacts.mjs --check
          node --test test/runtime/sid8580.test.mjs test/runtime/sidsynth.test.mjs
          node --test test/sid_player_voice_snapshot.test.mjs
          node --test test/sid_player_audio.test.mjs test/sid_player_processor.test.mjs
          node --test test/sid_player_manual.test.mjs
          npm run test:sid-synth
          node scripts/check_sid_synth_browser.cjs --out release/sid-synth-source-browser.json --screenshots release/sid-synth-source-images
          node scripts/check_sid_synth_import_browser.cjs --out release/sid-synth-import-source-browser.json --screenshots release/sid-synth-import-source-images
          node scripts/check_sid_synth_transport_upgrade_browser.cjs --out release/sid-synth-transport-source-browser.json --screenshots release/sid-synth-transport-source-images
          node scripts/check_sid_synth_live_presets_browser.cjs --out=release/sid-synth-live-presets-source-browser.json --screenshots=release/sid-synth-live-presets-source-images
          node scripts/check_sid_synth_song_manual_browser.cjs --out=release/sid-synth-song-manual-source-browser.json --screenshots=release/sid-synth-song-manual-source-images
      - name: Package and play the standalone SID Synth
        run: |
          sh scripts/package_itch_sid_synth.sh ci
          python3 -m zipfile -e release/tetorica_sid_synth_ci_itch.zip release/sid-synth-browser
          node scripts/check_sid_synth_browser.cjs --root release/sid-synth-browser --entry /index.html --out release/sid-synth-zip-browser.json --screenshots release/sid-synth-zip-images
          node scripts/check_sid_synth_import_browser.cjs --root release/sid-synth-browser --entry /index.html --out release/sid-synth-import-zip-browser.json --screenshots release/sid-synth-import-zip-images
          node scripts/check_sid_synth_transport_upgrade_browser.cjs --root release/sid-synth-browser --entry /index.html --out release/sid-synth-transport-zip-browser.json --screenshots release/sid-synth-transport-zip-images
          node scripts/check_sid_synth_live_presets_browser.cjs --root=release/sid-synth-browser --entry=/index.html --out=release/sid-synth-live-presets-zip-browser.json --screenshots=release/sid-synth-live-presets-zip-images
          node scripts/check_sid_synth_song_manual_browser.cjs --root=release/sid-synth-browser --entry=/index.html --out=release/sid-synth-song-manual-zip-browser.json --screenshots=release/sid-synth-song-manual-zip-images
          node scripts/check_synth_project_draft_reconnect_browser.cjs --mode=sid --root=release/sid-synth-browser --entry=/index.html --out=release/sid-draft-reconnect-browser.json --screenshots=release/sid-draft-reconnect-images
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sid-synth-check
          path: |
            release/tetorica_sid_synth_ci_itch.zip
            release/sid-synth-source-browser.json
            release/sid-synth-zip-browser.json
            release/sid-synth-import-source-browser.json
            release/sid-synth-import-zip-browser.json
            release/sid-synth-transport-source-browser.json
            release/sid-synth-transport-zip-browser.json
            release/sid-synth-source-images/
            release/sid-synth-zip-images/
            release/sid-synth-import-source-images/
            release/sid-synth-import-zip-images/
            release/sid-synth-transport-source-images/
            release/sid-synth-transport-zip-images/
            release/sid-synth-live-presets-source-browser.json
            release/sid-synth-live-presets-zip-browser.json
            release/sid-synth-live-presets-source-images/
            release/sid-synth-live-presets-zip-images/
            release/sid-synth-song-manual-source-browser.json
            release/sid-synth-song-manual-zip-browser.json
            release/sid-synth-song-manual-source-images/
            release/sid-synth-song-manual-zip-images/
            release/sid-draft-reconnect-browser.json
            release/sid-draft-reconnect-images/
          if-no-files-found: ignore
