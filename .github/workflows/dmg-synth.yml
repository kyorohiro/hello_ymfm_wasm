name: DMG Synth

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/synth-dmg/**'
      - 'docs/synth-gameboy/**'
      - 'docs/tetorica_dmg_synth.webp'
      - 'docs/js/gameboy*'
      - 'docs/js/playground_*'
      - 'docs/js/native*fx*'
      - 'docs/js/tetorica_virtual_files/**'
      - 'docs/playground/tetorica-*.d.ts'
      - 'docs/playground/playground_monaco*'
      - 'docs/js/ym2612vgm.js'
      - 'docs/js/opn_fm_vgm.js'
      - 'docs/js/vgm_file.js'
      - 'docs/vgm_analyzer/gameboy_voices.js'
      - 'docs/vgm_analyzer/gameboy_waves.js'
      - 'docs/generated/gameboy*'
      - 'docs/synth/synth_keyboard.js'
      - 'docs/synth/synth_menu.js'
      - 'docs/synth/synth_code*'
      - 'docs/synth-spu/synth.css'
      - 'docs/synth-spu/spu_synth_visualizer.js'
      - 'tetorica_src/runtime/gameboy*'
      - 'tetorica_src/runtime/generated/**'
      - 'scripts/*gameboy*'
      - 'scripts/*dmg*'
      - 'test/helpers/dmg_synth_song_fixture.mjs'
      - 'scripts/runtime_artifacts.mjs'
      - 'scripts/wasm_sdk_inventory.mjs'
      - 'third_party/soundchip-sdk.json'
      - 'third_party/tetorica-soundchip-native/**'
      - 'package*.json'
      - '.github/workflows/dmg-synth.yml'
  pull_request:
    paths:
      - 'docs/synth-dmg/**'
      - 'docs/synth-gameboy/**'
      - 'docs/tetorica_dmg_synth.webp'
      - 'docs/js/**'
      - 'docs/vgm_analyzer/gameboy_voices.js'
      - 'docs/vgm_analyzer/gameboy_waves.js'
      - 'docs/generated/**'
      - 'docs/synth/synth_keyboard.js'
      - 'docs/synth/synth_menu.js'
      - 'docs/synth/synth_code*'
      - 'docs/synth-spu/synth.css'
      - 'docs/synth-spu/spu_synth_visualizer.js'
      - 'tetorica_src/runtime/**'
      - 'scripts/**'
      - 'test/helpers/dmg_synth_song_fixture.mjs'
      - 'third_party/**'
      - 'package*.json'
      - '.github/workflows/dmg-synth.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Test and package the standalone DMG Synth
        run: |
          npm run test:dmg-synth
          sh scripts/package_itch_dmg_synth.sh ci
          python3 -m zipfile -e release/tetorica_dmg_synth_ci_itch.zip release/dmg-synth-browser
          node scripts/check_dmg_synth_browser.cjs --root release/dmg-synth-browser --entry /index.html --out release/dmg-synth-browser.json --screenshots release/dmg-synth-images
          node scripts/check_dmg_synth_menu_browser.cjs --root=release/dmg-synth-browser --entry=/index.html --out=release/dmg-synth-menu-browser.json --screenshots=release/dmg-synth-menu-images
          node scripts/check_dmg_synth_code_browser.cjs --root=release/dmg-synth-browser --entry=/index.html --out=release/dmg-synth-code-browser.json --screenshots=release/dmg-synth-code-images
          node scripts/check_dmg_synth_song_browser.cjs --root=release/dmg-synth-browser --entry=/index.html --out=release/dmg-synth-song-browser.json --screenshots=release/dmg-synth-song-images
          node scripts/check_dmg_synth_song_capture_browser.cjs --root=release/dmg-synth-browser --entry=/index.html --out=release/dmg-synth-song-capture-browser.json --screenshots=release/dmg-synth-song-capture-images
          node scripts/check_dmg_synth_song_seek_browser.cjs --root=release/dmg-synth-browser --entry=/index.html --out=release/dmg-synth-song-seek-browser.json --screenshots=release/dmg-synth-song-seek-images
      - name: Check real Code Monaco when its pinned CDN is available
        run: |
          if node scripts/check_dmg_synth_code_monaco_browser.cjs --root=release/dmg-synth-browser --entry=/index.html --engines=chromium,webkit --out=release/dmg-synth-code-monaco-browser.json; then
            true
          else
            result=$?
            test "$result" -eq 2
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dmg-synth-check
          path: |
            release/tetorica_dmg_synth_ci_itch.zip
            release/dmg-synth-browser.json
            release/dmg-synth-images/
            release/dmg-synth-menu-browser.json
            release/dmg-synth-menu-images/
            release/dmg-synth-code-browser.json
            release/dmg-synth-code-images/
            release/dmg-synth-song-browser.json
            release/dmg-synth-song-images/
            release/dmg-synth-song-capture-browser.json
            release/dmg-synth-song-capture-images/
            release/dmg-synth-song-seek-browser.json
            release/dmg-synth-song-seek-images/
            release/dmg-synth-code-monaco-browser.json
            release/dmg-synth-code-monaco-browser-*.png
          if-no-files-found: ignore
