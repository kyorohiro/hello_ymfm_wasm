name: ASWAN Synth

# Detailed verification is manual; routine tests run locally.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Test and package the standalone ASWAN Synth
        run: |
          npm run test:aswan-synth
          node --test docs/playground/wonderswan_vgm_import.test.mjs test/runtime/wonderswan_timeline.test.mjs test/runtime/playground_wonderswan_timeline.test.mjs
          node --test scripts/mixer_calibration_wonderswan_host_budget_revision.test.mjs
          node --test scripts/mixer_calibration_aswan_navigation_revision.test.mjs
          node --test docs/playground/playground_monaco_definitions.test.mjs scripts/package_itch_all.test.mjs
          sh scripts/package_itch_aswan_synth.sh ci
          python3 -m zipfile -e release/tetorica_aswan_synth_ci_itch.zip release/aswan-synth-browser
          node scripts/check_aswan_synth_browser.cjs --root=release/aswan-synth-browser --entry=/index.html --out=release/aswan-synth-browser.json --screenshots=release/aswan-synth-images
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aswan-synth-check
          path: |
            release/tetorica_aswan_synth_ci_itch.zip
            release/aswan-synth-browser.json
            release/aswan-synth-images/
          if-no-files-found: ignore
