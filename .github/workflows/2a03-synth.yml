name: 2A03 Synth

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/synth-2a03/**'
      - 'docs/synth-nes/**'
      - 'docs/tetorica_2a03_synth.webp'
      - 'docs/js/nesapu*'
      - 'docs/js/ym2612vgm.js'
      - 'docs/js/opn_fm_vgm.js'
      - 'docs/js/vgm_file.js'
      - 'docs/js/fds_audio.js'
      - 'docs/js/nes_apu_vendor/**'
      - 'docs/generated/nesapu*'
      - 'docs/synth/synth_keyboard.js'
      - 'docs/synth-spu/synth.css'
      - 'docs/synth-spu/spu_synth_visualizer.js'
      - 'tetorica_src/runtime/nesapu*'
      - 'tetorica_src/runtime/generated/**'
      - 'scripts/*nes*'
      - 'scripts/*2a03*'
      - 'scripts/runtime_artifacts.mjs'
      - 'scripts/wasm_sdk_inventory.mjs'
      - 'third_party/soundchip-sdk.json'
      - 'third_party/tetorica-soundchip-native/**'
      - 'third_party/jsnes/**'
      - 'third_party/fixnes-fds/**'
      - 'package*.json'
      - '.github/workflows/2a03-synth.yml'
  pull_request:
    paths:
      - 'docs/synth-2a03/**'
      - 'docs/synth-nes/**'
      - 'docs/tetorica_2a03_synth.webp'
      - 'docs/js/**'
      - 'docs/generated/**'
      - 'docs/synth/synth_keyboard.js'
      - 'docs/synth-spu/synth.css'
      - 'docs/synth-spu/spu_synth_visualizer.js'
      - 'tetorica_src/runtime/**'
      - 'scripts/**'
      - 'third_party/**'
      - 'package*.json'
      - '.github/workflows/2a03-synth.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Test and package the standalone 2A03 Synth
        run: |
          npm run test:2a03-synth
          sh scripts/package_itch_2a03_synth.sh ci
          python3 -m zipfile -e release/tetorica_2a03_synth_ci_itch.zip release/2a03-synth-browser
          node scripts/check_2a03_synth_browser.cjs --root release/2a03-synth-browser --entry /index.html --out release/2a03-synth-browser.json --screenshots release/2a03-synth-images
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 2a03-synth-check
          path: |
            release/tetorica_2a03_synth_ci_itch.zip
            release/2a03-synth-browser.json
            release/2a03-synth-images/
          if-no-files-found: ignore
