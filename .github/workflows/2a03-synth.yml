name: 2A03 Synth

# Detailed verification is manual; routine tests run locally.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Test and package the standalone 2A03 Synth
        run: |
          npm run test:2a03-synth
          sh scripts/package_itch_2a03_synth.sh ci
          python3 -m zipfile -e release/tetorica_2a03_synth_ci_itch.zip release/2a03-synth-browser
          node scripts/check_2a03_synth_browser.cjs --root release/2a03-synth-browser --entry /index.html --out release/2a03-synth-browser.json --screenshots release/2a03-synth-images
          node scripts/check_2a03_synth_code_browser.cjs --root=release/2a03-synth-browser --entry=/index.html --out=release/2a03-synth-code-browser.json --screenshots=release/2a03-synth-code-images
          node scripts/check_2a03_synth_song_browser.cjs --root=release/2a03-synth-browser --entry=/index.html --out=release/2a03-synth-song-browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 2a03-synth-check
          path: |
            release/tetorica_2a03_synth_ci_itch.zip
            release/2a03-synth-browser.json
            release/2a03-synth-images/
            release/2a03-synth-code-browser.json
            release/2a03-synth-code-images/
            release/2a03-synth-song-browser.json
          if-no-files-found: ignore
