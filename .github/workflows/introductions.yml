name: Interactive introductions

on:
  push:
    paths:
      - 'docs/introductions/**'
      - 'docs/index*.html'
      - 'docs/js/**'
      - 'docs/generated/**'
      - 'scripts/check_sid_filter_introduction_browser.cjs'
      - 'package*.json'
      - '.github/workflows/introductions.yml'
  pull_request:
    paths:
      - 'docs/introductions/**'
      - 'docs/index*.html'
      - 'docs/js/**'
      - 'docs/generated/**'
      - 'scripts/check_sid_filter_introduction_browser.cjs'
      - 'package*.json'
      - '.github/workflows/introductions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: introductions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lessons:
    name: Numeric examples and silent SID filter lesson
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test:introductions
      - run: npx playwright install --with-deps chromium webkit
      - name: Check both languages with physical output muted
        run: node scripts/check_sid_filter_introduction_browser.cjs --out="$RUNNER_TEMP/sid-filter-introduction.json" --screenshots="$RUNNER_TEMP/sid-filter-introduction-images"
      - name: Retain diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sid-filter-introduction
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/sid-filter-introduction.json
            ${{ runner.temp }}/sid-filter-introduction-images/
