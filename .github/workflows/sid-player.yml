name: SID Player

# Detailed verification is manual; routine tests run locally.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify bounded player sources and real CPU / PCM
        run: |
          node scripts/sid_player_artifacts.mjs --check
          node scripts/sid_rsid_artifacts.mjs --check
          node --test docs/synth-sid/handoff.test.mjs
          node --test test/sid_worklet_metrics.test.mjs test/sid_worklet_summary.test.mjs
          node --check scripts/check_sid_worklet_performance.mjs
          node --check scripts/sid_worklet_perf_plan.mjs
          npm run test:sid-player
          node scripts/check_sid_waveoff_c64.mjs --check --out release/sid-waveoff-c64-native.json
          npm run test:sid-corpus
          npm run test:sid-reference
          npm run check:runtime-artifacts
      - name: Play the source application
        run: node scripts/check_sid_player_browser.cjs --out release/sid-player-source-browser.json --screenshots release/sid-player-source-images
      - name: Capture source voices and audition them in SID Synth
        run: node scripts/check_sid_voice_capture_browser.cjs --root docs --out release/sid-voice-source-browser.json --screenshots release/sid-voice-source-images
      - name: Package and play the standalone player
        run: |
          npm run pack:sid-player -- ci
          python3 -m zipfile -e release/tetorica_sid_player_ci_itch.zip release/sid-player-browser
          node scripts/check_sid_player_browser.cjs --root release/sid-player-browser --entry /index.html --out release/sid-player-zip-browser.json --screenshots release/sid-player-zip-images
      - name: Capture packaged voices and load them in the packaged Synth
        run: |
          sh scripts/package_itch_sid_synth.sh ci-voice-snapshot
          python3 -m zipfile -e release/tetorica_sid_synth_ci-voice-snapshot_itch.zip release/sid-voice-synth
          node scripts/check_sid_voice_capture_browser.cjs --player-root release/sid-player-browser --synth-root release/sid-voice-synth --out release/sid-voice-zip-browser.json --screenshots release/sid-voice-zip-images
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sid-player-check
          path: |
            release/tetorica_sid_player_ci_itch.zip
            release/tetorica_sid_synth_ci-voice-snapshot_itch.zip
            release/sid-player-source-browser.json
            release/sid-player-zip-browser.json
            release/sid-voice-source-browser.json
            release/sid-voice-zip-browser.json
            release/sid-waveoff-c64-native.json
            release/sid-player-source-images/
            release/sid-player-zip-images/
            release/sid-voice-source-images/
            release/sid-voice-zip-images/
          if-no-files-found: ignore
