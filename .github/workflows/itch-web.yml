name: itch web release ZIPs

on:
  push:
  pull_request:
  workflow_dispatch:

# Build downloadable artifacts only. GitHub Releases and itch publication remain manual.
permissions:
  contents: read

concurrency:
  group: itch-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  itch-web:
    name: Package and verify the three web applications
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Prepare diagnostic output
        run: mkdir -p "$RUNNER_TEMP/itch-web/logs"
      - name: Install locked build and browser dependencies
        run: |
          npm ci 2>&1 | tee "$RUNNER_TEMP/itch-web/logs/npm-ci.log"
          npx playwright install --with-deps chromium webkit 2>&1 | tee "$RUNNER_TEMP/itch-web/logs/playwright-install.log"
      - name: Test Run ZIP preparation, UI bundling, archives and Game Boy conversion
        run: node --test scripts/prepare_itch_playground_run.test.mjs scripts/bundle_itch_playground_run.test.mjs scripts/check_itch_release_archives.test.mjs web/playground_sample_gameboy_preview.test.mjs 2>&1 | tee "$RUNNER_TEMP/itch-web/logs/run-package-tests.log"
      - name: Test PCM to BRR with the native and WASM S-DSP
        run: node --test web/snes_brr.test.mjs web/snes_brr_encoder.test.mjs web/snessynth.test.mjs web/spc.test.mjs 2>&1 | tee "$RUNNER_TEMP/itch-web/logs/brr-core-tests.log"
      - name: Test PCM to ADPCM-A with native and WASM YM2610 variants
        run: node --test web/adpcm_a_sample.test.mjs web/ym2610bsynth.test.mjs 2>&1 | tee "$RUNNER_TEMP/itch-web/logs/adpcm-a-core-tests.log"
      - name: Test experimental PS1 SPU with actual native and WASM cores
        run: |
          node --test web/ps1_spu.test.mjs web/ps1synth.test.mjs web/ps1_resampler.test.mjs web/playground_ps1.test.mjs web/playground_ps1_worklet.test.mjs web/native_genesis_ps1.test.mjs web/ps1_audition_continuity.test.mjs web/ps1_live_envelope.test.mjs 2>&1 | tee "$RUNNER_TEMP/itch-web/logs/ps1-spu-core-tests.log"
          node scripts/check_ps1_live_controls_offline.mjs --out "$RUNNER_TEMP/itch-web/ps1-live-controls-offline.json" 2>&1 | tee "$RUNNER_TEMP/itch-web/logs/ps1-live-controls-offline.log"
          node scripts/check_ps1_starter_levels.mjs --out "$RUNNER_TEMP/itch-web/ps1-starter-levels.json" 2>&1 | tee "$RUNNER_TEMP/itch-web/logs/ps1-starter-levels.log"
          node examples/nodejs/main_ps1_spu.js "$RUNNER_TEMP/itch-web/ps1-spu" 2>&1 | tee "$RUNNER_TEMP/itch-web/logs/ps1-spu-example.log"
      - name: Test PCM to SPU ADPCM with the actual native and WASM decoders
        run: |
          node --test web/ps1_adpcm_encoder.test.mjs web/ps1_adpcm_encoder_core.test.mjs 2>&1 | tee "$RUNNER_TEMP/itch-web/logs/ps1-adpcm-core-tests.log"
          node examples/nodejs/main_ps1_adpcm.js "$RUNNER_TEMP/itch-web/ps1-adpcm" 2>&1 | tee "$RUNNER_TEMP/itch-web/logs/ps1-adpcm-example.log"
      - name: Test PS1 Sample Editor conversion, isolated preview and instruments
        run: node --test web/playground_sample_ps1.test.mjs web/playground_sample_ps1_preview.test.mjs web/playground_sample_ps1_worker.test.mjs web/playground_sample_instrument.test.mjs 2>&1 | tee "$RUNNER_TEMP/itch-web/logs/ps1-sample-editor-tests.log"
      - name: Test PS1 ADSR, reverb and per-voice PCM drawing
        run: node --test web/ps1_parameters.test.mjs web/ps1_waveform.test.mjs web/playground_chip_inspector.test.mjs docs/playground/playground_ps1_voice_panel.test.mjs test/audio_clock_audit.test.cjs test/ps1_capture_reports.test.cjs 2>&1 | tee "$RUNNER_TEMP/itch-web/logs/ps1-voice-editor-tests.log"
      - name: Verify PS1 and WonderSwan Mixer references, generated defaults and saved absolute settings
        run: |
          node --test scripts/soundchip_calibration_ps1.test.mjs scripts/ps1_mixer_calibration.test.mjs scripts/soundchip_calibration_wonderswan.test.mjs scripts/wonderswan_mixer_calibration.test.mjs scripts/mixer_calibration_sources.test.mjs scripts/mixer_calibration_ps1_starter.test.mjs scripts/live_controls_mixer_calibration.test.mjs scripts/live_api_mixer_calibration.test.mjs scripts/generate_playground_mixer_defaults.test.mjs scripts/generate_soundchip_mixer_presets.test.mjs web/soundchip_mixer.test.mjs web/soundchip_mixer_presets.test.mjs docs/playground/playground_mixer_state.test.mjs 2>&1 | tee "$RUNNER_TEMP/itch-web/logs/ps1-mixer-tests.log"
          node scripts/calibrate_ps1_levels.cjs --verify --baseline docs/issues/ps1_chip_levels_live_api_01.json --out "$RUNNER_TEMP/itch-web/ps1-mixer.json" 2>&1 | tee "$RUNNER_TEMP/itch-web/logs/ps1-mixer.log"
          node scripts/calibrate_wonderswan_levels.cjs --verify --baseline docs/issues/wonderswan_chip_levels_live_api_01.json --out "$RUNNER_TEMP/itch-web/wonderswan-mixer.json" 2>&1 | tee "$RUNNER_TEMP/itch-web/logs/wonderswan-mixer.log"
      - name: Verify POKEY square-family reference, dual chips and generated Mixer defaults
        run: |
          node --test scripts/soundchip_calibration_pokey.test.mjs scripts/pokey_mixer_calibration.test.mjs 2>&1 | tee "$RUNNER_TEMP/itch-web/logs/pokey-mixer-tests.log"
          node scripts/check_pokey_calibration_offline.mjs --out "$RUNNER_TEMP/itch-web/pokey-mixer-offline.json" 2>&1 | tee "$RUNNER_TEMP/itch-web/logs/pokey-mixer-offline.log"
          node scripts/calibrate_pokey_levels.cjs --verify --baseline docs/issues/pokey_chip_levels_live_api_01.json --out "$RUNNER_TEMP/itch-web/pokey-mixer.json" 2>&1 | tee "$RUNNER_TEMP/itch-web/logs/pokey-mixer.log"
      - name: Distinguish renderer clock observations from captured PCM loss
        run: node scripts/check_audio_clock_browser.cjs --out "$RUNNER_TEMP/itch-web/audio-clock.json" 2>&1 | tee "$RUNNER_TEMP/itch-web/logs/audio-clock.log"
      - name: Test standalone PS1 SPU in browser and worker
        run: node scripts/check_ps1_spu_browser.cjs --out "$RUNNER_TEMP/itch-web/ps1-spu-browser.json" 2>&1 | tee "$RUNNER_TEMP/itch-web/logs/ps1-spu-browser.log"
      # Keep the same default commands and ZIP names used for manual releases.
      - name: Package Synth
        run: sh scripts/package_itch_synth.sh 2>&1 | tee "$RUNNER_TEMP/itch-web/logs/package-synth.log"
      - name: Package VGM Analyzer
        run: sh scripts/package_itch_vgm_analyzer.sh 2>&1 | tee "$RUNNER_TEMP/itch-web/logs/package-vgm-analyzer.log"
      - name: Package Playground download and browser Run ZIPs
        run: sh scripts/package_itch_playground.sh 2>&1 | tee "$RUNNER_TEMP/itch-web/logs/package-playground.log"
      - name: Validate actual release ZIPs and write checksums
        run: node scripts/check_itch_release_archives.mjs --release=release --out=release/itch-web-release.json --checksums=release/SHA256SUMS 2>&1 | tee "$RUNNER_TEMP/itch-web/logs/release-archives.log"
      - name: Test the packaged VGM Analyzer in Chromium and WebKit
        run: node scripts/check_analyzer_mixer_browser.cjs --root=release/itch_vgm_analyzer_dev 2>&1 | tee "$RUNNER_TEMP/itch-web/analyzer-browser.log"
      - name: Test the packaged Synth in Chromium and WebKit
        run: |
          node scripts/check_itch_synth_browser.cjs \
            --zip=release/hello_ymfm_wasm_dev_itch_synth.zip \
            --out="$RUNNER_TEMP/itch-web/synth-browser.json" \
            --images="$RUNNER_TEMP/itch-web/synth-images" \
            2>&1 | tee "$RUNNER_TEMP/itch-web/logs/synth-browser.log"
      - name: Test the packaged Playground in Chromium and WebKit
        run: |
          node scripts/check_itch_playground_bundle_browser.cjs \
            --zip=release/hello_ymfm_wasm_dev_itch_playground_for_run.zip \
            --out="$RUNNER_TEMP/itch-web/playground-browser.json" \
            --images="$RUNNER_TEMP/itch-web/images" \
            2>&1 | tee "$RUNNER_TEMP/itch-web/logs/playground-browser.log"
      - name: Test packaged POKEY System gains, dual chips, Worker and Stop in Chromium and WebKit
        run: |
          node scripts/check_itch_playground_bundle_browser.cjs \
            --zip=release/hello_ymfm_wasm_dev_itch_playground_for_run.zip \
            --modes=pokey,pokey-dual \
            --out="$RUNNER_TEMP/itch-web/pokey-packaged-browser.json" \
            --images="$RUNNER_TEMP/itch-web/pokey-packaged-images" \
            2>&1 | tee "$RUNNER_TEMP/itch-web/logs/pokey-packaged-browser.log"
      - name: Test Game Boy sample editing and converted preview in Chromium and WebKit
        run: |
          node scripts/check_gameboy_sample_editor_browser.cjs --webkit --host \
            --zip=release/hello_ymfm_wasm_dev_itch_playground_for_run.zip \
            --out="$RUNNER_TEMP/itch-web/gameboy-sample-browser.json" \
            --images="$RUNNER_TEMP/itch-web/gameboy-sample-images" \
            2>&1 | tee "$RUNNER_TEMP/itch-web/logs/gameboy-sample-browser.log"
      - name: Test encoded SNES BRR in packaged Main and Worker playback
        run: |
          node scripts/check_snes_brr_encoder_browser.cjs --webkit \
            --zip=release/hello_ymfm_wasm_dev_itch_playground_for_run.zip \
            --out="$RUNNER_TEMP/itch-web/snes-brr-browser.json" \
            2>&1 | tee "$RUNNER_TEMP/itch-web/logs/snes-brr-browser.log"
      - name: Test PS1 mode, Keyboard and SPU edits in the packaged Playground
        run: |
          node scripts/check_playground_ps1_browser.cjs \
            --zip=release/hello_ymfm_wasm_dev_itch_playground_for_run.zip \
            --out="$RUNNER_TEMP/itch-web/ps1-mode-browser.json" \
            2>&1 | tee "$RUNNER_TEMP/itch-web/logs/ps1-mode-browser.log"
      - name: Test PCM to SPU ADPCM in the packaged Playground
        run: |
          node scripts/check_ps1_adpcm_encoder_browser.cjs \
            --zip=release/hello_ymfm_wasm_dev_itch_playground_for_run.zip \
            --out="$RUNNER_TEMP/itch-web/ps1-adpcm-browser.json" \
            2>&1 | tee "$RUNNER_TEMP/itch-web/logs/ps1-adpcm-browser.log"
      - name: Test PS1 live voice, PCM and reverb editing in the packaged Playground
        run: |
          node scripts/check_ps1_voice_editor_browser.cjs \
            --zip=release/hello_ymfm_wasm_dev_itch_playground_for_run.zip \
            --out="$RUNNER_TEMP/itch-web/ps1-voice-editor-browser.json" \
            --screenshots="$RUNNER_TEMP/itch-web/ps1-voice-editor-images" \
            2>&1 | tee "$RUNNER_TEMP/itch-web/logs/ps1-voice-editor-browser.log"
      - name: Test PS1 Sample Editor and saved Keyboard instruments in the packaged Playground
        run: |
          node scripts/check_ps1_sample_editor_browser.cjs \
            --zip=release/hello_ymfm_wasm_dev_itch_playground_for_run.zip \
            --out="$RUNNER_TEMP/itch-web/ps1-sample-editor-browser.json" \
            --screenshots="$RUNNER_TEMP/itch-web/ps1-sample-editor-images" \
            2>&1 | tee "$RUNNER_TEMP/itch-web/logs/ps1-sample-editor-browser.log"
      - name: Verify all packaged PS1 PCM capture reports against the exact Run ZIP
        run: |
          node scripts/check_ps1_capture_reports.cjs \
            --reports-dir="$RUNNER_TEMP/itch-web" \
            --archive=release/hello_ymfm_wasm_dev_itch_playground_for_run.zip \
            --out="$RUNNER_TEMP/itch-web/ps1-capture-reports.json" \
            2>&1 | tee "$RUNNER_TEMP/itch-web/logs/ps1-capture-reports.log"
      - name: Test encoded ADPCM-A in both packaged Neo Geo modes
        run: |
          node scripts/check_adpcm_a_encoder_browser.cjs --webkit \
            --zip=release/hello_ymfm_wasm_dev_itch_playground_for_run.zip \
            --out="$RUNNER_TEMP/itch-web/adpcm-a-browser.json" \
            2>&1 | tee "$RUNNER_TEMP/itch-web/logs/adpcm-a-browser.log"
      # Download and extract this artifact container to obtain the unchanged
      # individual ZIPs for manual GitHub Release attachments / itch uploads.
      - name: Retain verified release ZIPs for manual publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: itch-web-release-zips
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
          path: |
            release/hello_ymfm_wasm_dev_itch_synth.zip
            release/hello_ymfm_wasm_dev_itch_vgm_analyzer.zip
            release/hello_ymfm_wasm_dev_itch_playground.zip
            release/hello_ymfm_wasm_dev_itch_playground_for_run.zip
            release/SHA256SUMS
            release/itch-web-release.json
      - name: Retain validation logs and browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: itch-web-validation
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/itch-web/
            release/itch-web-release.json
