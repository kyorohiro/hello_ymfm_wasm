name: SNES S-DSP Synth

# Detailed verification is manual; routine tests run locally.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Test the shared SNES API and types
        run: |
          node --test test/runtime/spc_voice_edit.test.mjs test/runtime/playground_spc.test.mjs test/runtime/spc_audio.test.mjs test/runtime/snessynth.test.mjs test/runtime/snes_echo.test.mjs test/runtime/playground_snes.test.mjs test/runtime/playground_snes_worklet.test.mjs test/runtime/native_genesis_snes.test.mjs test/runtime/native_genesis_extra_snes.test.mjs
          node scripts/check_playground_mode_types.mjs
          node scripts/check_fm2612_types.mjs
      - name: Test the standalone SNES S-DSP Synth
        run: |
          npm run test:snes-synth
          node scripts/check_snes_synth_browser.cjs --out release/snes-synth-source-browser.json --screenshots release/snes-synth-source-images
          node scripts/check_snes_synth_spc_browser.cjs --out release/snes-spc-source-browser.json
          node scripts/check_snes_synth_spc_live_browser.cjs --out release/snes-spc-live-source-browser.json
          node scripts/check_snes_synth_sound_library_browser.cjs --out release/snes-sound-library-source-browser.json
          node scripts/check_snes_synth_channel_parity_browser.cjs --out release/snes-parity-source-browser.json
          node scripts/check_snes_synth_channel_edit_browser.cjs --out release/snes-edit-source-browser.json
          node scripts/check_snes_synth_seek_browser.cjs --out release/snes-seek-source-browser.json
          node scripts/check_snes_synth_looper_browser.cjs --out release/snes-looper-source-browser.json
      - name: Package and play the independent ZIP
        run: |
          sh scripts/package_itch_snes_synth.sh ci
          python3 -m zipfile -e release/tetorica_sdsp_synth_ci_itch.zip release/snes-synth-browser
          node scripts/check_snes_synth_browser.cjs --root release/snes-synth-browser --entry /index.html --out release/snes-synth-browser.json --screenshots release/snes-synth-images
          node scripts/check_snes_synth_spc_browser.cjs --root release/snes-synth-browser --entry /index.html --out release/snes-spc-browser.json
          node scripts/check_snes_synth_spc_live_browser.cjs --root release/snes-synth-browser --entry /index.html --out release/snes-spc-live-browser.json
          node scripts/check_snes_synth_sound_library_browser.cjs --root release/snes-synth-browser --entry /index.html --out release/snes-sound-library-browser.json
          node scripts/check_snes_synth_channel_parity_browser.cjs --root release/snes-synth-browser --entry /index.html --out release/snes-parity-browser.json
          node scripts/check_snes_synth_channel_edit_browser.cjs --root release/snes-synth-browser --entry /index.html --out release/snes-edit-browser.json
          node scripts/check_snes_synth_seek_browser.cjs --root release/snes-synth-browser --entry /index.html --out release/snes-seek-browser.json
          node scripts/check_snes_synth_looper_browser.cjs --root release/snes-synth-browser --entry /index.html --out release/snes-looper-browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snes-sdsp-synth-check
          path: |
            release/tetorica_sdsp_synth_ci_itch.zip
            release/snes-synth-source-browser.json
            release/snes-synth-source-images/
            release/snes-synth-browser.json
            release/snes-synth-images/
            release/snes-spc-*.json
            release/snes-spc-*.png
            release/snes-looper-*.json
            release/snes-looper-*.png
            release/snes-sound-library-*.json
            release/snes-sound-library-*.png
            release/snes-parity-*.json
            release/snes-parity-*.png
          if-no-files-found: ignore
