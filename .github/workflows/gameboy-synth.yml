name: Game Boy Synth

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/synth-gameboy/**'
      - 'docs/js/gameboy*'
      - 'docs/generated/gameboy*'
      - 'docs/synth/synth_keyboard.js'
      - 'docs/synth-spu/synth.css'
      - 'docs/synth-spu/spu_synth_visualizer.js'
      - 'tetorica_src/runtime/gameboy*'
      - 'tetorica_src/runtime/generated/**'
      - 'scripts/*gameboy*'
      - 'scripts/runtime_artifacts.mjs'
      - 'scripts/wasm_sdk_inventory.mjs'
      - 'third_party/soundchip-sdk.json'
      - 'third_party/tetorica-soundchip-native/**'
      - 'package*.json'
      - '.github/workflows/gameboy-synth.yml'
  pull_request:
    paths:
      - 'docs/synth-gameboy/**'
      - 'docs/js/**'
      - 'docs/generated/**'
      - 'docs/synth/synth_keyboard.js'
      - 'docs/synth-spu/synth.css'
      - 'docs/synth-spu/spu_synth_visualizer.js'
      - 'tetorica_src/runtime/**'
      - 'scripts/**'
      - 'third_party/**'
      - 'package*.json'
      - '.github/workflows/gameboy-synth.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Test and package the standalone Game Boy Synth
        run: |
          npm run test:gameboy-synth
          sh scripts/package_itch_gameboy_synth.sh ci
          python3 -m zipfile -e release/tetorica_gameboy_synth_ci_itch.zip release/gameboy-synth-browser
          node scripts/check_gameboy_synth_browser.cjs --root release/gameboy-synth-browser --entry /index.html --out release/gameboy-synth-browser.json --screenshots release/gameboy-synth-images
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameboy-synth-check
          path: |
            release/tetorica_gameboy_synth_ci_itch.zip
            release/gameboy-synth-browser.json
            release/gameboy-synth-images/
          if-no-files-found: ignore
