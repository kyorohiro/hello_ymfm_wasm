name: SBI export tests
# Run routine tests locally; use a tag push or an explicit manual CI run.
on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  sbi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:sbi
