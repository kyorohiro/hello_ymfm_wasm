name: SID8580 isolated probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'third_party/sidera/**'
      - 'third_party/chips-m6502/**'
      - 'tetorica_src/wasm/sid8580-probe/**'
      - 'scripts/*sid8580_probe*'
      - 'scripts/check_sid8580_bus.mjs'
      - 'scripts/check_sid8580_cpu.mjs'
      - 'scripts/*sid8580_quality*'
      - 'scripts/*sid8580_cutoff*'
      - 'scripts/check_sid8580_calibration.mjs'
      - 'scripts/package_sid8580_sourcekit.mjs'
      - 'test/helpers/sid8580_probe_fixtures.mjs'
      - 'test/helpers/sid8580_bus_fixtures.mjs'
      - 'test/helpers/sid8580_cpu_fixtures.mjs'
      - 'test/helpers/sid8580_legacy_parity.rs'
      - 'test/helpers/sid8580_quality_fixtures.mjs'
      - 'test/sid8580_quality_metrics.test.mjs'
      - 'test/helpers/sid8580_cutoff_fixtures.mjs'
      - 'test/sid8580_cutoff_metrics.test.mjs'
      - 'test/fixtures/sid8580_cutoff_baseline.json'
      - 'docs/issues/sid8580_cutoff_plan_01.json'
      - 'docs/issues/sid8580_cutoff_method_01.md'
      - 'docs/issues/sid8580_cutoff_training_before_01.json'
      - 'tetorica_src/cli/sid_reference_metrics.mjs'
      - 'docs/issues/sid8580_probe_verification_01.json'
      - '.github/workflows/sid8580-probe.yml'
  pull_request:
    paths:
      - 'third_party/sidera/**'
      - 'third_party/chips-m6502/**'
      - 'tetorica_src/wasm/sid8580-probe/**'
      - 'scripts/*sid8580_probe*'
      - 'scripts/check_sid8580_bus.mjs'
      - 'scripts/check_sid8580_cpu.mjs'
      - 'scripts/*sid8580_quality*'
      - 'scripts/*sid8580_cutoff*'
      - 'scripts/check_sid8580_calibration.mjs'
      - 'scripts/package_sid8580_sourcekit.mjs'
      - 'test/helpers/sid8580_probe_fixtures.mjs'
      - 'test/helpers/sid8580_bus_fixtures.mjs'
      - 'test/helpers/sid8580_cpu_fixtures.mjs'
      - 'test/helpers/sid8580_legacy_parity.rs'
      - 'test/helpers/sid8580_quality_fixtures.mjs'
      - 'test/sid8580_quality_metrics.test.mjs'
      - 'test/helpers/sid8580_cutoff_fixtures.mjs'
      - 'test/sid8580_cutoff_metrics.test.mjs'
      - 'test/fixtures/sid8580_cutoff_baseline.json'
      - 'docs/issues/sid8580_cutoff_plan_01.json'
      - 'docs/issues/sid8580_cutoff_method_01.md'
      - 'docs/issues/sid8580_cutoff_training_before_01.json'
      - 'tetorica_src/cli/sid_reference_metrics.mjs'
      - 'docs/issues/sid8580_probe_verification_01.json'
      - '.github/workflows/sid8580-probe.yml'

permissions:
  contents: read

jobs:
  native-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: '1.91.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Rust and WASM target
        run: rustup toolchain install 1.91.1 --profile minimal --target wasm32-unknown-unknown
      - name: Build isolated Native and WASM candidate
        run: sh scripts/build_sid8580_probe.sh
      - name: Check cycle, read, PCM, ownership and split-render parity
        run: node scripts/check_sid8580_probe.mjs --baseline docs/issues/sid8580_probe_verification_01.json --out build/sid8580-probe/verification.json
      - name: Check bounded bus retention and read side effects
        run: node scripts/check_sid8580_bus.mjs --out build/sid8580-probe/bus-verification.json
      - name: Check real CPU reads, branches, writes and faults
        run: node scripts/check_sid8580_cpu.mjs --out build/sid8580-probe/cpu-verification.json
      - name: Check analytical quality metrics
        run: node --test test/sid8580_quality_metrics.test.mjs
      - name: Check analytical LP and HP crossover metrics
        run: node --test test/sid8580_cutoff_metrics.test.mjs
      - name: Recompute the training-only cutoff fit
        run: node scripts/analyze_sid8580_cutoff.mjs --fit docs/issues/sid8580_cutoff_training_before_01.json --plan docs/issues/sid8580_cutoff_plan_01.json --check
      - name: Check controlled candidate captures without a GPL oracle
        run: node scripts/check_sid8580_quality.mjs --out build/sid8580-probe/quality-verification.json
      - name: Check opt-in calibration and unchanged defaults
        run: node scripts/check_sid8580_calibration.mjs --out build/sid8580-probe/calibration-policy.json
      - name: Check independent cutoff flags and unchanged defaults
        run: node scripts/check_sid8580_cutoff_policy.mjs --out build/sid8580-probe/cutoff-policy.json
      - name: Check candidate cutoff holdouts with both experimental flags
        run: node scripts/check_sid8580_cutoff.mjs --validation --cutoff-calibrated --resonance-calibrated --out build/sid8580-probe/cutoff-holdout.json
      - name: Preserve the upstream sample-clock API
        run: |
          rustc --edition=2021 -C opt-level=3 -C panic=abort --crate-name sidera_upstream --crate-type rlib third_party/sidera/upstream/src/lib.rs -o build/sid8580-probe/libsidera_upstream.rlib
          rustc --edition=2021 -C opt-level=3 -C panic=abort test/helpers/sid8580_legacy_parity.rs --extern sidera=build/sid8580-probe/libsidera.rlib --extern sidera_upstream=build/sid8580-probe/libsidera_upstream.rlib -o build/sid8580-probe/legacy-parity
          build/sid8580-probe/legacy-parity
      - name: Check matching artifact receipts
        run: node scripts/sid8580_probe_artifacts.mjs --check build/sid8580-probe
      - name: Check readable source-kit closure
        run: node scripts/package_sid8580_sourcekit.mjs --plan
