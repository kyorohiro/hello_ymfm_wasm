name: YM2149 ST Synth

# Run routine tests locally; use a tag push or an explicit manual CI run.
on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Test and package the standalone YM2149 ST Synth
        run: |
          npm run test:ym2149-st-synth
          python3 scripts/verify_ay8910_reference.py
          node scripts/atari_audio_player_artifacts.mjs --check
          node scripts/check_ym2149_st_reference_browser.cjs --engines=chromium,webkit --out=release/ym2149-st-reference-source.json --screenshots=release/ym2149-st-reference-source-images
          sh scripts/package_itch_ym2149_st_synth.sh ci
          python3 -m zipfile -e release/tetorica_ym2149_st_synth_ci_itch.zip release/ym2149-st-synth-browser
          node scripts/check_ym2149_st_synth_browser.cjs --root=release/ym2149-st-synth-browser --entry=/index.html --out=release/ym2149-st-synth-browser.json --screenshots=release/ym2149-st-synth-images
          node scripts/check_ym2149_st_reference_browser.cjs --root=release/ym2149-st-synth-browser --entry=/index.html --engines=chromium,webkit --out=release/ym2149-st-reference-browser.json --screenshots=release/ym2149-st-reference-images
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ym2149-st-synth-check
          path: |
            release/tetorica_ym2149_st_synth_ci_itch.zip
            release/ym2149-st-synth-browser.json
            release/ym2149-st-synth-images/
            release/ym2149-st-reference-source.json
            release/ym2149-st-reference-source-images/
            release/ym2149-st-reference-browser.json
            release/ym2149-st-reference-images/
          if-no-files-found: ignore
