name: HuC6280 Synth

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/synth-huc6280/**'
      - 'docs/tetorica_huc6280_synth.webp'
      - 'docs/js/huc6280*'
      - 'docs/js/msm5205*'
      - 'docs/js/adpcm_b_sample.js'
      - 'docs/js/wav.js'
      - 'docs/js/cdda*'
      - 'docs/js/soundchip_mixer_presets.js'
      - 'docs/js/ym2612vgm.js'
      - 'docs/js/opn_fm_vgm.js'
      - 'docs/js/vgm_file.js'
      - 'docs/js/vgmplayer.js'
      - 'docs/generated/huc6280*'
      - 'docs/generated/msm5205*'
      - 'docs/generated/cdda*'
      - 'docs/licenses/libvgm-msm5205/**'
      - 'docs/synth/synth_keyboard.js'
      - 'docs/synth/synth_code*'
      - 'docs/synth/synth_*store*'
      - 'docs/playground/playground_monaco*'
      - 'docs/playground/tetorica-*.d.ts'
      - 'docs/js/playground_code_runtime.js'
      - 'docs/js/native*fx*'
      - 'tetorica_src/native/audio_effect/**'
      - 'docs/synth-spu/synth.css'
      - 'docs/synth-spu/spu_synth_visualizer.js'
      - 'tetorica_src/runtime/huc6280*'
      - 'test/runtime/huc6280_state.test.mjs'
      - 'tetorica_src/runtime/ym2612vgm.js'
      - 'tetorica_src/runtime/opn_fm_vgm.js'
      - 'tetorica_src/runtime/vgm_file.js'
      - 'tetorica_src/runtime/vgmplayer.js'
      - 'tetorica_src/runtime/generated/**'
      - 'scripts/*huc6280*'
      - 'scripts/copy_readable_modules.mjs'
      - 'scripts/copy_application_audio_sources.mjs'
      - 'scripts/copy_msm5205_sources.mjs'
      - 'scripts/copy_cdda_sources.mjs'
      - 'scripts/mixer_calibration_huc6280_ui_revision*'
      - 'scripts/mixer_calibration_code_note_revision*'
      - 'docs/issues/huc6280_cdrom2_definition_ui_revision_01.json'
      - 'docs/issues/code_note_target_ownership_revision_01.json'
      - 'scripts/runtime_artifacts.mjs'
      - 'scripts/wasm_sdk_inventory.mjs'
      - 'third_party/soundchip-sdk.json'
      - 'third_party/tetorica-soundchip-native/**'
      - 'package*.json'
      - '.github/workflows/huc6280-synth.yml'
  pull_request:
    paths:
      - 'docs/synth-huc6280/**'
      - 'docs/tetorica_huc6280_synth.webp'
      - 'docs/js/**'
      - 'docs/generated/**'
      - 'docs/synth/synth_keyboard.js'
      - 'docs/synth/synth_code*'
      - 'docs/synth/synth_*store*'
      - 'docs/playground/playground_monaco*'
      - 'docs/playground/tetorica-*.d.ts'
      - 'tetorica_src/native/audio_effect/**'
      - 'docs/synth-spu/synth.css'
      - 'docs/synth-spu/spu_synth_visualizer.js'
      - 'tetorica_src/runtime/**'
      - 'test/runtime/huc6280_state.test.mjs'
      - 'scripts/**'
      - 'third_party/**'
      - 'package*.json'
      - '.github/workflows/huc6280-synth.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Test and package the standalone HuC6280 Synth
        run: |
          npm run test:huc6280-synth
          node --test scripts/mixer_calibration_huc6280_ui_revision.test.mjs scripts/mixer_calibration_code_note_revision.test.mjs
          sh scripts/package_itch_huc6280_synth.sh ci
          python3 -m zipfile -e release/tetorica_huc6280_synth_ci_itch.zip release/huc6280-synth-browser
          node scripts/check_huc6280_synth_browser.cjs --root release/huc6280-synth-browser --entry /index.html --out release/huc6280-synth-browser.json --screenshots release/huc6280-synth-images
          node scripts/check_huc6280_synth_code_browser.cjs --root=release/huc6280-synth-browser --entry=/index.html --out=release/huc6280-synth-code-browser.json --screenshots=release/huc6280-synth-code-images
          node scripts/check_huc6280_synth_cdrom2_browser.cjs --root=release/huc6280-synth-browser --entry=/index.html --out=release/huc6280-synth-cdrom2-browser.json --screenshots=release/huc6280-synth-cdrom2-images
          node scripts/check_huc6280_synth_msm5205_browser.cjs --root=release/huc6280-synth-browser --entry=/index.html --out=release/huc6280-synth-msm5205-browser.json --screenshots=release/huc6280-synth-msm5205-images
          node scripts/check_huc6280_synth_cdda_browser.cjs --root=release/huc6280-synth-browser --entry=/index.html --out=release/huc6280-synth-cdda-browser.json --screenshots=release/huc6280-synth-cdda-images
          node scripts/check_huc6280_synth_manual_browser.cjs --root=release/huc6280-synth-browser --entry=/index.html --out=release/huc6280-synth-manual-browser.json --screenshots=release/huc6280-synth-manual-images
          node scripts/check_huc6280_synth_vgm_manual_browser.cjs --root=release/huc6280-synth-browser --entry=/index.html --out=release/huc6280-synth-vgm-manual-browser.json --screenshots=release/huc6280-synth-vgm-manual-images
          node scripts/check_huc6280_synth_song_browser.cjs --root=release/huc6280-synth-browser --entry=/index.html --out=release/huc6280-synth-song-browser.json --screenshots=release/huc6280-synth-song-images
          node scripts/check_huc6280_synth_live_browser.cjs --root=release/huc6280-synth-browser --entry=/index.html --out=release/huc6280-synth-live-browser.json --screenshots=release/huc6280-synth-live-images
          node scripts/check_huc6280_synth_capture_browser.cjs --root=release/huc6280-synth-browser --entry=/index.html --out=release/huc6280-synth-capture-browser.json --screenshots=release/huc6280-synth-capture-images
          node scripts/check_huc6280_synth_mixer_browser.cjs --root=release/huc6280-synth-browser --entry=/index.html --out=release/huc6280-synth-mixer-browser.json --screenshots=release/huc6280-synth-mixer-images
          node scripts/check_huc6280_synth_seek_browser.cjs --root=release/huc6280-synth-browser --entry=/index.html --out=release/huc6280-synth-seek-browser.json --screenshots=release/huc6280-synth-seek-images
          node scripts/check_huc6280_synth_cache_browser.cjs --root=release/huc6280-synth-browser --entry=/index.html --out=release/huc6280-synth-cache-browser.json --screenshots=release/huc6280-synth-cache-images
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huc6280-synth-check
          path: |
            release/tetorica_huc6280_synth_ci_itch.zip
            release/huc6280-synth-browser.json
            release/huc6280-synth-images/
            release/huc6280-synth-code-browser.json
            release/huc6280-synth-code-images/
            release/huc6280-synth-cdrom2-browser.json
            release/huc6280-synth-cdrom2-images/
            release/huc6280-synth-msm5205-browser.json
            release/huc6280-synth-msm5205-images/
            release/huc6280-synth-cdda-browser.json
            release/huc6280-synth-cdda-images/
            release/huc6280-synth-manual-browser.json
            release/huc6280-synth-manual-images/
            release/huc6280-synth-vgm-manual-browser.json
            release/huc6280-synth-vgm-manual-images/
            release/huc6280-synth-song-browser.json
            release/huc6280-synth-song-images/
            release/huc6280-synth-live-browser.json
            release/huc6280-synth-live-images/
            release/huc6280-synth-capture-browser.json
            release/huc6280-synth-capture-images/
            release/huc6280-synth-mixer-browser.json
            release/huc6280-synth-mixer-images/
            release/huc6280-synth-seek-browser.json
            release/huc6280-synth-seek-images/
            release/huc6280-synth-cache-browser.json
            release/huc6280-synth-cache-images/
          if-no-files-found: ignore
