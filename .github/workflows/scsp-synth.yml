name: SCSP Synth

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/synth-scsp/**'
      - 'docs/tetorica-scsp-synth.webp'
      - 'docs/js/**'
      - 'docs/generated/scsp*'
      - 'docs/generated/ssf-player/**'
      - 'docs/synth/synth_keyboard.js'
      - 'docs/synth/synth_code*.js'
      - 'docs/synth/synth_project_store.js'
      - 'docs/synth/synth_menu.js'
      - 'docs/synth-spu/synth.css'
      - 'docs/synth-spu/spu_synth_visualizer.js'
      - 'docs/synth-2a03/state_observer.js'
      - 'docs/playground/**'
      - 'tetorica_src/runtime/scspsynth*'
      - 'tetorica_src/runtime/generated/**'
      - 'tetorica_src/native/audio_effect/**'
      - 'tetorica_src/wasm/ssf_player/**'
      - 'test/helpers/scsp_ssf_fixture.mjs'
      - 'test/runtime/*scsp*'
      - 'scripts/*scsp*'
      - 'scripts/mixer_calibration_aswan_navigation_revision*'
      - 'docs/issues/aswan_shared_client_navigation_ui_revision_01.json'
      - 'scripts/*ssf*'
      - 'scripts/copy_readable_modules.mjs'
      - 'scripts/runtime_artifacts.mjs'
      - 'scripts/wasm_sdk_inventory.mjs'
      - 'third_party/**'
      - 'package*.json'
      - '.github/workflows/scsp-synth.yml'
  pull_request:
    paths:
      - 'docs/synth-scsp/**'
      - 'docs/tetorica-scsp-synth.webp'
      - 'docs/js/**'
      - 'docs/generated/**'
      - 'docs/synth/**'
      - 'docs/synth-spu/synth.css'
      - 'docs/synth-spu/spu_synth_visualizer.js'
      - 'docs/synth-2a03/state_observer.js'
      - 'docs/playground/**'
      - 'tetorica_src/runtime/**'
      - 'tetorica_src/native/audio_effect/**'
      - 'tetorica_src/wasm/ssf_player/**'
      - 'test/helpers/scsp_ssf_fixture.mjs'
      - 'test/runtime/*scsp*'
      - 'scripts/**'
      - 'docs/issues/aswan_shared_client_navigation_ui_revision_01.json'
      - 'third_party/**'
      - 'package*.json'
      - '.github/workflows/scsp-synth.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Navigation receipt tests compare the original committed sources.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Test and package the standalone SCSP Synth
        run: |
          npm run test:scsp-synth
          npm run test:runtime:types
          node --test test/runtime/scsp_loop_link.test.mjs scripts/mixer_calibration_scsp_loop_link_revision.test.mjs
          node --test scripts/mixer_calibration_scsp_navigation_revision.test.mjs scripts/mixer_calibration_scsp_draft_revision.test.mjs scripts/mixer_calibration_scsp_empty_draft_revision.test.mjs
          node --test scripts/mixer_calibration_scsp_dsp_ui_revision.test.mjs scripts/scsp_dsp_routing_ui_default_parity.test.mjs
          node --test scripts/mixer_calibration_scsp_dsp_flow_revision.test.mjs
          node --test scripts/mixer_calibration_scsp_fm_custom_revision.test.mjs scripts/scsp_fm_custom2_default_parity.test.mjs
          node --test scripts/mixer_calibration_scsp_fm_multi_revision.test.mjs scripts/scsp_fm_multi_default_parity.test.mjs
          node scripts/record_scsp_fm_multi_revision.mjs --check
          node --test scripts/mixer_calibration_scsp_fm_depth_revision.test.mjs scripts/scsp_fm_depth_default_parity.test.mjs
          node scripts/record_scsp_fm_depth_revision.mjs --check
          node --test scripts/mixer_calibration_scsp_ssf_dsp_revision.test.mjs
          node scripts/record_scsp_ssf_dsp_revision.mjs --check
          node scripts/record_scsp_ssf_dsp_passive_parity.mjs --check
          node --test scripts/mixer_calibration_scsp_fm_self_feedback_revision.test.mjs scripts/scsp_fm_self_feedback_default_parity.test.mjs
          node scripts/record_scsp_fm_self_feedback_revision.mjs --check
          node --test scripts/mixer_calibration_scsp_fm_multi_self_feedback_revision.test.mjs scripts/scsp_fm_multi_self_feedback_default_parity.test.mjs
          node scripts/record_scsp_fm_multi_self_feedback_revision.mjs --check
          node --test scripts/mixer_calibration_scsp_fm_multiple_self_revision.test.mjs scripts/scsp_fm_multiple_self_default_parity.test.mjs
          node scripts/record_scsp_fm_multiple_self_revision.mjs --check
          node --test scripts/mixer_calibration_playground_scsp_cycle2_examples_revision.test.mjs
          node scripts/record_playground_scsp_cycle2_examples_revision.mjs --check
          node scripts/build_playground_examples.mjs --check
          node --test docs/playground/playground_examples.test.mjs docs/playground/playground_mode_starters.test.mjs
          node --test scripts/scsp_fm_cycle2.test.mjs docs/playground/playground_scsp_cycle2_example.test.mjs
          node scripts/record_scsp_shared_client_navigation_ui_revision.mjs --check
          sh scripts/package_itch_scsp_synth.sh ci
          python3 -m zipfile -e release/tetorica_scsp_synth_ci_itch.zip release/scsp-synth-browser
          node scripts/check_scsp_synth_browser.cjs --root release/scsp-synth-browser --entry /index.html --out release/scsp-synth-browser.json
          node scripts/check_scsp_synth_code_browser.cjs --root=release/scsp-synth-browser --entry=/index.html --out=release/scsp-synth-code-browser.json --screenshots=release/scsp-synth-code-images
          node scripts/check_scsp_synth_song_browser.cjs --root=release/scsp-synth-browser --entry=/index.html --out=release/scsp-synth-song-browser.json
          node scripts/check_scsp_synth_ssf_browser.cjs --root=release/scsp-synth-browser --entry=/index.html --out=release/scsp-synth-ssf-browser.json --screenshots=release/scsp-synth-ssf-images
          node scripts/check_scsp_synth_live_browser.cjs --root=release/scsp-synth-browser --entry=/index.html --out=release/scsp-synth-live-browser.json --screenshots=release/scsp-synth-live-images
          node scripts/check_scsp_synth_capture_browser.cjs --root=release/scsp-synth-browser --entry=/index.html --out=release/scsp-synth-capture-browser.json --screenshots=release/scsp-synth-capture-images
          node scripts/check_scsp_synth_channels_browser.cjs --root=release/scsp-synth-browser --entry=/index.html --out=release/scsp-synth-channels-browser.json --screenshots=release/scsp-synth-channels-images
          node scripts/check_scsp_synth_click_guard_browser.cjs --root=release/scsp-synth-browser --entry=/index.html --out=release/scsp-synth-click-guard-browser.json --screenshots=release/scsp-synth-click-guard-images
          node scripts/check_scsp_synth_paused_edit_browser.cjs --root=release/scsp-synth-browser --entry=/index.html --out=release/scsp-synth-ssf-edit-browser.json --screenshots=release/scsp-synth-ssf-edit-images
          node scripts/check_scsp_synth_dsp_routing_browser.cjs --root=release/scsp-synth-browser --entry=/index.html --out=release/scsp-synth-dsp-routing-browser.json
          node scripts/check_scsp_synth_dsp_flow_browser.cjs --root=release/scsp-synth-browser --entry=/index.html --out=release/scsp-synth-dsp-flow-browser.json
          node scripts/check_scsp_synth_fm_custom_browser.cjs --root=release/scsp-synth-browser --entry=/index.html --out=release/scsp-synth-fm-custom-browser.json
          node scripts/check_scsp_synth_fm_multi_browser.cjs --root=release/scsp-synth-browser --entry=/index.html --out=release/scsp-synth-fm-multi-browser.json
          node scripts/check_scsp_synth_fm_depth_browser.cjs --root=release/scsp-synth-browser --entry=/index.html --out=release/scsp-synth-fm-depth-browser.json
          node scripts/check_scsp_synth_ssf_dsp_browser.cjs --root=release/scsp-synth-browser --entry=/index.html --out=release/scsp-synth-ssf-dsp-browser.json
          node scripts/check_scsp_synth_self_feedback_browser.cjs --root=release/scsp-synth-browser --entry=/index.html --out=release/scsp-synth-self-feedback-browser.json
          node scripts/check_scsp_synth_multi_self_feedback_browser.cjs --root=release/scsp-synth-browser --entry=/index.html --out=release/scsp-synth-multi-self-feedback-browser.json
          node scripts/check_scsp_synth_multiple_self_browser.cjs --root=release/scsp-synth-browser --entry=/index.html --out=release/scsp-synth-multiple-self-browser.json
          node scripts/check_scsp_cycle2_prototype_browser.cjs --root=docs --out=release/scsp-cycle2-prototype-browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scsp-synth-check
          path: |
            release/tetorica_scsp_synth_ci_itch.zip
            release/scsp-synth-browser.json
            release/scsp-synth-code-browser.json
            release/scsp-synth-code-images/
            release/scsp-synth-song-browser.json
            release/scsp-synth-ssf-browser.json
            release/scsp-synth-ssf-images/
            release/scsp-synth-live-browser.json
            release/scsp-synth-live-images/
            release/scsp-synth-capture-browser.json
            release/scsp-synth-capture-images/
            release/scsp-synth-channels-browser.json
            release/scsp-synth-channels-images/
            release/scsp-synth-click-guard-browser.json
            release/scsp-synth-click-guard-images/
            release/scsp-synth-ssf-edit-browser.json
            release/scsp-synth-ssf-edit-images/
            release/scsp-synth-dsp-routing-browser.json
            release/scsp-synth-dsp-flow-browser.json
            release/scsp-synth-dsp-flow-browser-*.png
            release/scsp-synth-fm-custom-browser.json
            release/scsp-synth-fm-custom-browser-*.png
            release/scsp-synth-fm-multi-browser.json
            release/scsp-synth-fm-multi-browser-*.png
            release/scsp-synth-fm-depth-browser.json
            release/scsp-synth-fm-depth-browser-*.png
            release/scsp-synth-ssf-dsp-browser.json
            release/scsp-synth-ssf-dsp-browser-*.png
            release/scsp-synth-self-feedback-browser.json
            release/scsp-synth-self-feedback-browser-*.png
            release/scsp-synth-multi-self-feedback-browser.json
            release/scsp-synth-multi-self-feedback-browser-*.png
            release/scsp-synth-multiple-self-browser.json
            release/scsp-synth-multiple-self-browser-*.png
            release/scsp-cycle2-prototype-browser.json
            release/scsp-cycle2-prototype-browser-*.png
          if-no-files-found: ignore
