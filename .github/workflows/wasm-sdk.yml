name: WASM SDK build and parity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm-sdk:
    name: All 27 WASM builds
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: emscripten-core/setup-emsdk@667eb33f24e84e7f362c16d8d7fff0629a73e15e # v15
        with:
          version: '6.0.6'
      - name: Test receipt validation, runner guards and standalone DX7 checks
        run: node --test test/wasm_sdk_inventory.test.mjs test/check_wasm_sdk.test.mjs test/check_dx7_wasm_sdk_cli.test.mjs
      - name: Build all fixed SDK cores and compare with the committed runtimes
        run: node scripts/check_wasm_sdk.mjs --work-dir "$RUNNER_TEMP/wasm-sdk"
      - name: Retain build logs, receipts and parity reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wasm-sdk-validation
          retention-days: 7
          if-no-files-found: warn
          path: ${{ runner.temp }}/wasm-sdk/
